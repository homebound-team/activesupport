version: 2.1

orbs:
  node: circleci/node@5.0.1

workflows:
  version: 2
  workflow:
    jobs:
      - build:
          context: npm-readonly
      - test:
          context: npm-readonly
      - publish:
          requires:
            - build
            - test
          context:
            - npm-trusted-publish
            - npm-readonly
            - github
          filters:
            branches:
              only:
                - main

jobs:
  build:
    docker:
      - image: cimg/node:26.2.0
    steps:
      - checkout
      - run:
          name: Login in NPM
          command: 'echo "npmAuthToken: $NPM_TOKEN" >> ${HOME}/.yarnrc.yml'
      - node/install-packages:
          pkg-manager: yarn-berry
      - run: yarn lint
      - run: yarn build
      - run: yarn generate:globals --check
      - run: yarn generate:barrels --check
  test:
    docker:
      - image: cimg/node:26.2.0
    steps:
      - checkout
      - run:
          name: Login in NPM
          command: 'echo "npmAuthToken: $NPM_TOKEN" >> ${HOME}/.yarnrc.yml'
      - node/install-packages:
          pkg-manager: yarn-berry
      - run: yarn test
      - store_test_results:
          path: ./junit-reports
  publish:
    docker:
      - image: cimg/node:26.2.0
    steps:
      - checkout
      - run:
          name: Login in NPM
          command: 'echo "npmAuthToken: $NPM_TOKEN" >> ${HOME}/.yarnrc.yml'
      - node/install-packages:
          pkg-manager: yarn-berry
      - run: yarn build
      - run:
          name: Release
          command: |
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud":"npm:registry.npmjs.org"}')
            yarn semantic-release
